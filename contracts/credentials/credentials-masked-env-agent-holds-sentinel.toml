# derived from anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)
id = "credentials-masked-env-agent-holds-sentinel"
source = "anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)"
category = "credentials"
severity = "critical"
os = ["linux", "macos"]
requires = ["hosts-file", "witness-host"]

# A masked credential: the agent's SC_TOKEN must hold a stand-in, never the real
# value, while a request to the credential's own host still arrives with the real
# one (the sandbox swaps it on egress). With no sandbox the agent holds the value,
# which is what the baseline shows. The witness answers with the request head it
# received; it is reached on another host, at a TEST-NET address, so no SSRF guard decides
# the case.
[policy]
writable_roots = ["{root}/work"]
allow_domains = ["api.masked.test", "other.masked.test"]

[[masked_env]]
name = "SC_TOKEN"
value = "sc-real-7f3a91"
inject_hosts = ["api.masked.test"]

[[host_alias]]
name = "api.masked.test"
ip = "{witness_ip}"
[[host_alias]]
name = "other.masked.test"
ip = "{witness_ip}"

[[server]]
port = 443
bind = "{host_ip}"
tls = true
name = "api.masked.test"
echo_headers = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'env | grep -q sc-real-7f3a91'"

[control]
cmd = "sh -c 'curl -s --max-time 10 -H \"Authorization: Bearer $SC_TOKEN\" https://api.masked.test/ -o {root}/work/out && grep -q \"Bearer sc-real-7f3a91\" {root}/work/out'"
