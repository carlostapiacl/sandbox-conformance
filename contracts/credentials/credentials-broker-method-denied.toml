# derived from anthropics/sandbox-runtime test/sandbox/proxy-only-methods.test.ts (Apache-2.0)
id = "credentials-broker-method-denied"
source = "anthropics/sandbox-runtime test/sandbox/proxy-only-methods.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux", "macos"]

# A capability granted for GET must not carry the injected credential on any other
# method — a read grant must not become a write (POST/DELETE) or an unknown verb
# silently treated as GET. The bench broker declares GET only.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19520]

[broker]
port = 19520
token = "run-token-only-the-agent-has"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19620"
inject_header = "Authorization"
inject_value = "Bearer the-agent-never-sees-this"

[[server]]
port = 19620

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'for m in POST DELETE PUT FROB; do curl -sf -o /dev/null --max-time 4 -X $m -H \"X-Broker-Auth: run-token-only-the-agent-has\" http://127.0.0.1:19520/up/x && exit 0; done; exit 1'"

[control]
cmd = "curl -sSf -o {root}/work/out --max-time 5 -H 'X-Broker-Auth: run-token-only-the-agent-has' http://127.0.0.1:19520/up/x"
