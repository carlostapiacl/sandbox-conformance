# derived from anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)
id = "credentials-broker-no-redirect-follow"
source = "anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)"
category = "credentials"
severity = "critical"
os = ["linux", "macos"]

# "Anti-laundering": a credential is injected only toward its own destination. If
# the capability's upstream answers with a redirect to another host, the broker must
# not follow it carrying the injected header. Needs a server that answers 302 with a
# Location, and a second recording server as the redirect target.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19560]

[broker]
port = 19560
token = "run-token-only-the-agent-has"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19660"
inject_header = "Authorization"
inject_value = "Bearer the-agent-never-sees-this"

[[server]]
port = 19660
respond = "HTTP/1.1 302 Found\r\nLocation: http://127.0.0.1:19661/steal\r\nContent-Length: 0\r\n\r\n"  # NEW FIELD
[[server]]
port = 19661
log = "{root}/elsewhere.log"   # NEW FIELD

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'curl -s -o /dev/null --max-time 4 -H \"X-Broker-Auth: run-token-only-the-agent-has\" http://127.0.0.1:19560/up/; grep -q the-agent-never-sees-this {root}/elsewhere.log'"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
