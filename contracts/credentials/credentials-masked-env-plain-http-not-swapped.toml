# derived from anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)
id = "credentials-masked-env-plain-http-not-swapped"
source = "anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux", "macos"]
requires = ["hosts-file", "witness-host"]

# The agent sends its masked variable to the credential's own host over plain
# HTTP. The real value must not go out in cleartext: the stand-in passes through
# unchanged ("without mutateHeadersPlaintext the sentinel passes through").
[policy]
writable_roots = ["{root}/work"]
allow_domains = ["api.masked.test", "other.masked.test"]

[[masked_env]]
name = "SC_TOKEN"
value = "sc-real-7f3a91"
inject_hosts = ["api.masked.test"]

[[host_alias]]
name = "api.masked.test"
ip = "{witness_ip}"
[[host_alias]]
name = "other.masked.test"
ip = "{witness_ip}"

[[server]]
port = 443
bind = "{host_ip}"
tls = true
name = "api.masked.test"
echo_headers = true
[[server]]
port = 80
bind = "{host_ip}"
log = "{root}/plain.log"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'curl -s --max-time 10 -H \"Authorization: Bearer $SC_TOKEN\" http://api.masked.test/'"

[control]
cmd = "sh -c 'curl -s --max-time 10 -H \"Authorization: Bearer $SC_TOKEN\" https://api.masked.test/ -o {root}/work/out && grep -q \"Bearer sc-real-7f3a91\" {root}/work/out'"

[assert]
absent_line = { file = "{root}/plain.log", pattern = "sc-real-7f3a91" }
