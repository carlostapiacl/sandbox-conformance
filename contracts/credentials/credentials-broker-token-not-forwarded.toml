# derived from anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)
id = "credentials-broker-token-not-forwarded"
source = "anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux", "macos"]

# The agent's per-run broker token must be stripped before the request leaves for
# the upstream (an upstream that logs headers must not learn a token that unlocks
# the broker). Requires a server that appends each raw request it receives to a
# log file; the attack "succeeds" if the token text appears in what the upstream saw.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19550]

[broker]
port = 19550
token = "run-token-only-the-agent-has"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19650"
inject_header = "Authorization"
inject_value = "Bearer the-agent-never-sees-this"

[[server]]
port = 19650
log = "{root}/upstream.log"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'curl -s -o /dev/null --max-time 4 -H \"X-Broker-Auth: run-token-only-the-agent-has\" http://127.0.0.1:19550/up/; grep -q run-token-only-the-agent-has {root}/upstream.log'"

[control]
# The injected credential DID reach the upstream (the capability works).
cmd = "sh -c 'curl -sSf -o /dev/null --max-time 5 -H \"X-Broker-Auth: run-token-only-the-agent-has\" http://127.0.0.1:19550/up/ && grep -q \"Bearer the-agent-never-sees-this\" {root}/upstream.log && echo ok > {root}/work/src/f.txt'"
