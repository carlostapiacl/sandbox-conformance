# derived from anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)
id = "credentials-masked-env-not-in-process-records"
source = "anthropics/sandbox-runtime test/sandbox/credential-mask.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux"]
requires = ["hosts-file", "witness-host"]

# The real value of a masked credential must not be readable in any process
# record the agent can reach: the environ and command line of the sandbox's own
# processes, and of everything else it can see in /proc ("the real value never
# appears in the wrapped command string"). Without a sandbox the agent's own
# environ holds it. 'sc-real-7f3a9[1]' keeps the attack's own argv from matching.
[policy]
writable_roots = ["{root}/work"]
allow_domains = ["api.masked.test", "other.masked.test"]

[[masked_env]]
name = "SC_TOKEN"
value = "sc-real-7f3a91"
inject_hosts = ["api.masked.test"]

[[host_alias]]
name = "api.masked.test"
ip = "{witness_ip}"
[[host_alias]]
name = "other.masked.test"
ip = "{witness_ip}"

[[server]]
port = 443
bind = "{host_ip}"
tls = true
name = "api.masked.test"
echo_headers = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat /proc/[0-9]*/environ /proc/[0-9]*/cmdline 2>/dev/null | tr \"\\0\" \"\\n\" | grep -q \"sc-real-7f3a9[1]\"'"

[control]
cmd = "sh -c 'curl -s --max-time 10 -H \"Authorization: Bearer $SC_TOKEN\" https://api.masked.test/ -o {root}/work/out && grep -q \"Bearer sc-real-7f3a91\" {root}/work/out'"
