# derived from openai/codex codex-rs/linux-sandbox/tests/suite/sandbox.rs::sandbox_reenables_writable_subpaths_under_unreadable_parents (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "filesystem-write-reallow-inside-deny-by-omission"
source = "openai/codex codex-rs/linux-sandbox/tests/suite/sandbox.rs::sandbox_reenables_writable_subpaths_under_unreadable_parents (Apache-2.0)"
derived_from = "filesystem-write-reallow-inside-deny"
category = "filesystem"
severity = "medium"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work", "{root}/vault/mine"]
read_allows = ["{root}/vault/mine"]

[[fixture]]
path = "{root}/work"
dir = true

[[fixture]]
path = "{root}/vault/other"
content = "TOPSECRET"

[[fixture]]
path = "{root}/vault/mine/keep"
content = "x"

[attack]
cmd = "cat {root}/vault/other"

[control]
cmd = "printf allowed > {root}/vault/mine/note && test \"$(cat {root}/vault/mine/note)\" = allowed"
