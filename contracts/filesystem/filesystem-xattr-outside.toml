# derived from nolabs-ai/nono tests/integration/test_commands.sh (destructive metadata ops) (Apache-2.0)
# setxattr is not a Landlock right either. On macOS the interesting case is
# stripping com.apple.quarantine / writing xattrs on files outside the
# territory (Seatbelt file-write-xattr). Python's os.setxattr is Linux-only,
# so macOS uses /usr/bin/xattr. EXPECTED: VIOLATION on Linux (Landlock-only).
id = "filesystem-xattr-outside"
source = "nolabs-ai/nono tests/integration/test_commands.sh (destructive metadata ops) (Apache-2.0)"
category = "filesystem"
severity = "medium"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/outside/download.bin"
content = "bin"
[[fixture]]
path = "{root}/work/f"
content = "x"

[attack]
cmd = "sh -c 'if command -v setfattr >/dev/null; then setfattr -n user.pwned -v 1 {root}/outside/download.bin; else /usr/bin/xattr -w user.pwned 1 {root}/outside/download.bin; fi'"

[control]
cmd = "sh -c 'echo ok > {root}/work/f'"
