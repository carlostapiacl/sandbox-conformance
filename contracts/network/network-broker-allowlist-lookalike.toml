# derived from anthropics/sandbox-runtime test/sandbox/domain-pattern.test.ts and test/sandbox/canonical-host-routing.test.ts (Apache-2.0)
id = "network-broker-allowlist-lookalike"
source = "anthropics/sandbox-runtime test/sandbox/domain-pattern.test.ts and test/sandbox/canonical-host-routing.test.ts (Apache-2.0)"
category = "network"
severity = "critical"
os = ["linux", "macos"]

# With egress scoped to `.allowed.test`, a lookalike must be refused before any
# dial: `evilallowed.test`, `allowed.test.evil.test`, `ALLOWED.test.evil.test`,
# a userinfo trick `allowed.test@evil.test`, and the trailing-dot form of a
# denied sibling. The allowed name (and its trailing-dot and upper-case
# spellings) must still pass.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19516]

[broker]
port = 19516
token = "tok-dom"
allowed_hosts = [".allowed.test"]
allow_internal = true   # the test names resolve to loopback, where the fake upstream listens

# The names resolve to the fake upstream, for this case only.
[[host_alias]]
name = "api.allowed.test"
ip = "127.0.0.1"
[[host_alias]]
name = "evilallowed.test"
ip = "127.0.0.1"
[[host_alias]]
name = "allowed.test.evil.test"
ip = "127.0.0.1"

[[server]]
port = 19616

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'for h in evilallowed.test allowed.test.evil.test ALLOWED.test.evil.test; do curl -s -o /dev/null -w \"%{http_code}\" --max-time 4 -x http://127.0.0.1:19516 -H \"X-Broker-Auth: tok-dom\" http://$h:19616/ | grep -q 200 && exit 0; done; exit 1'"

[control]
cmd = "curl -sS -o {root}/work/out --max-time 5 -x http://127.0.0.1:19516 -H 'X-Broker-Auth: tok-dom' http://api.allowed.test:19616/"
