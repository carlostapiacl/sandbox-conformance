# derived from anthropics/sandbox-runtime test/sandbox/glob-expand.test.ts (Apache-2.0)
id = "secrets-glob-read-deny"
source = "anthropics/sandbox-runtime test/sandbox/glob-expand.test.ts (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["macos"]

# A single-segment glob read deny (*.env) must block every matching file —
# including one CREATED after launch — while non-matching neighbours stay readable.
[policy]
writable_roots = ["{root}/work"]
glob_read_denies = ["{root}/work/cfg/*.env"]   # PROPOSED field, not in PolicySpec

[[fixture]]
path = "{root}/work/cfg/secret.env"
content = "SECRET_DATA"
[[fixture]]
path = "{root}/work/cfg/public.txt"
content = "PUBLIC_DATA"

[attack]
cmd = "cat {root}/work/cfg/secret.env || { cp {root}/work/cfg/public.txt {root}/work/cfg/late.env && cat {root}/work/cfg/late.env; }"

[control]
cmd = "cat {root}/work/cfg/public.txt >/dev/null && echo ok > {root}/work/f.txt"
