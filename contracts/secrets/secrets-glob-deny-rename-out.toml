# derived from anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)
id = "secrets-glob-deny-rename-out"
source = "anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["macos"]

# A single-segment glob read-deny (*.pem) inside the writable root. The matched
# file is unreadable, a non-matching sibling stays readable, and renaming the
# matched file to a name the glob does NOT match must not carry it out.
[policy]
writable_roots = ["{root}/work"]
# HYPOTHETICAL FIELD: maps to the policy's glob-deny field {pattern, read=true, write=false}
glob_read_denies = ["{root}/work/conf/*.pem"]

[[fixture]]
path = "{root}/work/conf/bad.pem"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/conf/plain.txt"
content = "PLAIN"

[attack]
cmd = "sh -c 'cat {root}/work/conf/bad.pem || (mv {root}/work/conf/bad.pem {root}/work/conf/moved.txt && grep -q TOPSECRET {root}/work/conf/moved.txt)'"

[control]
cmd = "sh -c 'grep -q PLAIN {root}/work/conf/plain.txt && echo ok > {root}/work/f.txt'"

[assert]
unchanged = "{root}/work/conf/bad.pem"
