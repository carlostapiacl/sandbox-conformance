# derived from anthropics/sandbox-runtime test/sandbox/read-list-precedence.test.ts, test/sandbox/read-deny-glob.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-given-via-symlink-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/read-list-precedence.test.ts, test/sandbox/read-deny-glob.test.ts (Apache-2.0)"
derived_from = "read-deny-given-via-symlink"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"

[[fixture]]
path = "{root}/a/b"
dir = true

[[fixture]]
path = "{root}/alias"
symlink_to = "{root}/a/b"

[[fixture]]
path = "{root}/a/b/l2"
symlink_to = "{root}/vault"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/vault/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
