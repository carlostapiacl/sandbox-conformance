# derived from anthropics/sandbox-runtime test/sandbox/linux-mount-plan-record.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-allow-symlink-into-deny-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/linux-mount-plan-record.test.ts (Apache-2.0)"
derived_from = "read-allow-symlink-into-deny"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/work/docs"]

[[fixture]]
path = "{root}/home/.ssh/id_rsa"
content = "PRIVATEKEY"

[[fixture]]
path = "{root}/work/docs"
symlink_to = "{root}/home/.ssh"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat {root}/work/docs/id_rsa 2>/dev/null || cat {root}/home/.ssh/id_rsa'"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
