# derived from anthropics/sandbox-runtime test/sandbox/linux-one-mount-per-destination.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-alt-spelling-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/linux-one-mount-per-destination.test.ts (Apache-2.0)"
derived_from = "read-deny-alt-spelling"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"

[[fixture]]
path = "{root}/link"
symlink_to = "{root}/vault"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/vault/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
