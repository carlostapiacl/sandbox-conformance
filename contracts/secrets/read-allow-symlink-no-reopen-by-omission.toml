# derived from anthropics/sandbox-runtime test/sandbox/read-deny-glob.test.ts, test/sandbox/read-list-precedence.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-allow-symlink-no-reopen-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/read-deny-glob.test.ts, test/sandbox/read-list-precedence.test.ts (Apache-2.0)"
derived_from = "read-allow-symlink-no-reopen"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/proj"]
read_allows = ["{root}/proj/docs"]

[[fixture]]
path = "{root}/home/.ssh/id_rsa"
content = "TOPSECRET"

[[fixture]]
path = "{root}/proj/src"
dir = true

[[fixture]]
path = "{root}/proj/docs"
symlink_to = "{root}/home/.ssh"

[attack]
cmd = "sh -c 'cat {root}/proj/docs/id_rsa || cat {root}/home/.ssh/id_rsa'"

[control]
cmd = "echo ok > {root}/proj/src/f.txt"
