# derived from anthropics/sandbox-runtime test/sandbox/rules-through-links-on-every-runtime.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-link-dotdot-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/rules-through-links-on-every-runtime.test.ts (Apache-2.0)"
derived_from = "read-deny-link-dotdot"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/here/file"]

[[fixture]]
path = "{root}/elsewhere/file"
content = "TOPSECRET"

[[fixture]]
path = "{root}/elsewhere/in/other"
content = "x"

[[fixture]]
path = "{root}/here/file"
content = "public"

[[fixture]]
path = "{root}/here/link"
symlink_to = "../elsewhere/in"

[[fixture]]
path = "{root}/here/up"
symlink_to = "link/../file"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/elsewhere/file"

[control]
cmd = "cat {root}/here/file >/dev/null && echo ok > {root}/work/src/f.txt"
