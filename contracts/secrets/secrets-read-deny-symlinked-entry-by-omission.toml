# derived from anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "secrets-read-deny-symlinked-entry-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)"
derived_from = "secrets-read-deny-symlinked-entry"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/dotfiles/vimrc"]

[[fixture]]
path = "{root}/dotfiles/netrc"
content = "machine forge.example password hunter2"

[[fixture]]
path = "{root}/dotfiles/vimrc"
content = "public"

[[fixture]]
path = "{root}/home/.netrc"
symlink_to = "{root}/dotfiles/netrc"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'grep -q hunter2 {root}/home/.netrc || grep -q hunter2 {root}/dotfiles/netrc'"

[control]
cmd = "sh -c 'grep -q public {root}/dotfiles/vimrc && echo ok > {root}/work/src/f.txt'"
