# derived from nolabs-ai/nono crates/nono-cli/tests/glob_deny_after_start_run.rs (double_star / single_star / deleted_and_recreated) (Apache-2.0)
# NEEDS RUNNER FEATURES: `glob_denies` in [policy] (core Policy has it,
# macOS-only, single-segment) and `[[late_fixture]]`.
# A glob deny (*.pem) must match files created after launch, not just the
# matches that existed when the profile was compiled.
id = "secrets-glob-deny-created-after-start"
source = "nolabs-ai/nono crates/nono-cli/tests/glob_deny_after_start_run.rs (double_star / single_star / deleted_and_recreated) (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["macos"]

[policy]
writable_roots = ["{root}/work"]
glob_denies = [{ pattern = "{root}/home/certs/*.pem", read = true, write = true }]   # NEW KEY

[[fixture]]
path = "{root}/home/certs"
dir = true
[[fixture]]
path = "{root}/work/src"
dir = true

[[late_fixture]]                        # NEW TABLE
path = "{root}/home/certs/late.pem"
content = "-----BEGIN PRIVATE KEY-----"
after_ms = 800

[attack]
cmd = "sh -c 'sleep 2; cat {root}/home/certs/late.pem'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
