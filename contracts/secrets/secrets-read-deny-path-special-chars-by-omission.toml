# derived from nolabs-ai/nono tests/integration/test_edge_cases.sh ("path with spaces", "dashes and underscores") (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "secrets-read-deny-path-special-chars-by-omission"
source = "nolabs-ai/nono tests/integration/test_edge_cases.sh (\"path with spaces\", \"dashes and underscores\") (Apache-2.0)"
derived_from = "secrets-read-deny-path-special-chars"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/my vault \"prod\" (x)/key"
content = "TOPSECRET"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat '{root}/my vault \"prod\" (x)/key'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
