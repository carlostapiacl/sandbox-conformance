# derived from anthropics/sandbox-runtime test/sandbox/readonly-deny-dir-binds.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-around-nested-root-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/readonly-deny-dir-binds.test.ts (Apache-2.0)"
derived_from = "read-deny-around-nested-root"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work", "{root}/vault/w"]

[[fixture]]
path = "{root}/work"
dir = true

[[fixture]]
path = "{root}/vault/other.txt"
content = "TOPSECRET"

[[fixture]]
path = "{root}/vault/w/notes.txt"
content = "notes"

[attack]
cmd = "cat {root}/vault/other.txt"

[control]
cmd = "cat {root}/vault/w/notes.txt >/dev/null && echo ok > {root}/vault/w/f.txt"
