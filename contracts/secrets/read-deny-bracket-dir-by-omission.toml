# derived from anthropics/sandbox-runtime test/sandbox/brackets-that-spell-no-set.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-bracket-dir-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/brackets-that-spell-no-set.test.ts (Apache-2.0)"
derived_from = "read-deny-bracket-dir"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/tree/u/a.env"]

[[fixture]]
path = "{root}/tree/[user-id]/secret"
content = "TOPSECRET"

[[fixture]]
path = "{root}/tree/u/a.env"
content = "public"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat '{root}/tree/[user-id]/secret'"

[control]
cmd = "cat {root}/tree/u/a.env >/dev/null && echo ok > {root}/work/src/f.txt"
