# derived from anthropics/sandbox-runtime test/sandbox/execute-only-binary.test.ts (Apache-2.0)
id = "secrets-host-process-environ"
source = "anthropics/sandbox-runtime test/sandbox/execute-only-binary.test.ts (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

# The agent's OWN env is scrubbed (env-secret-scrub), but a same-uid host process
# outside the sandbox may hold the secret in its environ. With
# isolate_process_info the agent cannot read another process's environ
# (/proc/<pid>/environ on Linux, KERN_PROCARGS2 / ps -E on macOS).
# 'leak-m[e]' keeps grep's own argv from matching itself.
[policy]
writable_roots = ["{root}/work"]
isolate_process_info = true

# HYPOTHETICAL TABLE: a host-side process the runner starts OUTSIDE the sandbox,
# with this env, kept alive for the run, killed afterwards.
[[canary_process]]
env = ["HOST_SECRET_TOKEN=leak-me"]
cmd = "sleep 30"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'if [ \"$(uname)\" = Linux ]; then cat /proc/[0-9]*/environ 2>/dev/null | tr \"\\0\" \"\\n\" | grep -q \"leak-m[e]\"; else ps -Aeww -o command= 2>/dev/null | grep -q \"leak-m[e]\"; fi'"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
