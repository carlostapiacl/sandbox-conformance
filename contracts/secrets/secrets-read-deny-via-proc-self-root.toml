# derived from denoland/deno tests/specs/permission/special (GHSA-m87g-7g5m-wpx4, /proc/self/root) (MIT)
id = "secrets-read-deny-via-proc-self-root"
source = "denoland/deno tests/specs/permission/special (GHSA-m87g-7g5m-wpx4, /proc/self/root) (MIT)"
category = "secrets"
severity = "critical"
os = ["linux"]

# /proc/self/root is a link to the process's own root directory, so
# /proc/self/root/<path> names any file by a second spelling. A read-deny must
# hold however the path is spelled: a backend that matches the denied path as a
# string, before the kernel resolves it, lets the secret through this way.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.netrc"]

[[fixture]]
path = "{root}/home/.netrc"
content = "machine forge.example password hunter2"
[[fixture]]
path = "{root}/home/notes.txt"
content = "public"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "grep -q hunter2 /proc/self/root{root}/home/.netrc"

[control]
cmd = "sh -c 'grep -q public /proc/self/root{root}/home/notes.txt && echo ok > {root}/work/src/f.txt'"

[assert]
unchanged = "{root}/home/.netrc"
