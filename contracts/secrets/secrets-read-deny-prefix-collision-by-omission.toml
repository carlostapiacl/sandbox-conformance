# derived from nolabs-ai/nono tests/integration/test_sensitive_paths.sh ("Path Collision Bypass Prevention": ~/.sshfoo, ~/.awsbackup) (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "secrets-read-deny-prefix-collision-by-omission"
source = "nolabs-ai/nono tests/integration/test_sensitive_paths.sh (\"Path Collision Bypass Prevention\": ~/.sshfoo, ~/.awsbackup) (Apache-2.0)"
derived_from = "secrets-read-deny-prefix-collision"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/home/.sshfoo"]

[[fixture]]
path = "{root}/work"
dir = true

[[fixture]]
path = "{root}/home/.ssh/id_ed25519"
content = "PRIVATE-KEY"

[[fixture]]
path = "{root}/home/.sshfoo/fake"
content = "not-a-key"

[attack]
cmd = "cat {root}/home/.ssh/id_ed25519"

[control]
cmd = "cat {root}/home/.sshfoo/fake"
