# derived from anthropics/sandbox-runtime test/sandbox/names-with-a-backslash.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-backslash-name-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/names-with-a-backslash.test.ts (Apache-2.0)"
derived_from = "read-deny-backslash-name"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]
read_allows = ["{root}/tree/a/b"]

[[fixture]]
path = "{root}/tree/a\\b"
content = "TOPSECRET"

[[fixture]]
path = "{root}/tree/a/b"
content = "public"

[[fixture]]
path = "{root}/link"
symlink_to = "tree"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat '{root}/tree/a\\b'"

[control]
cmd = "cat '{root}/tree/a/b' >/dev/null && echo ok > {root}/work/src/f.txt"
