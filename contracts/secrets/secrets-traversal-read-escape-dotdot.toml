# derived from OpenHands/software-agent-sdk tests/sdk/io/test_local_filestore_security.py::test_path_traversal_attacks_blocked (MIT)
# The read side of the same guarantee: a ".." traversal (work/../vault/key) must
# not read a file outside the workspace. The read-deny is matched by the resolved
# path, so climbing out with ".." does not reach the secret.
id = "secrets-traversal-read-escape-dotdot"
source = "OpenHands/software-agent-sdk tests/sdk/io/test_local_filestore_security.py::test_path_traversal_attacks_blocked (MIT)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/work/../vault/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/vault/key"
