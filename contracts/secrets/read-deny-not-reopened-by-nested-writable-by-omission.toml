# derived from anthropics/sandbox-runtime test/sandbox/default-write-paths.test.ts (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "read-deny-not-reopened-by-nested-writable-by-omission"
source = "anthropics/sandbox-runtime test/sandbox/default-write-paths.test.ts (Apache-2.0)"
derived_from = "read-deny-not-reopened-by-nested-writable"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work", "{root}/vault/logs"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"

[[fixture]]
path = "{root}/vault/logs"
dir = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat {root}/vault/key || ls {root}/vault | grep -q key'"

[control]
cmd = "sh -c 'echo ok > {root}/vault/logs/f.txt && echo ok > {root}/work/src/f.txt'"
