# derived from nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs (symlinked grants must resolve) (Apache-2.0)
# BY-OMISSION VARIANT: the granted model (read_scope = "granted"). The protected
# path lives outside every grant, so it is unreadable because nobody granted it;
# read_denies are not used. Same attack, control and assert as the original.
id = "secrets-read-deny-on-symlinked-path-by-omission"
source = "nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs (symlinked grants must resolve) (Apache-2.0)"
derived_from = "secrets-read-deny-on-symlinked-path"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
read_scope = "granted"
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/dotfiles/aws/credentials"
content = "aws_secret_access_key=TOPSECRET"

[[fixture]]
path = "{root}/home/.aws"
symlink_to = "{root}/dotfiles/aws"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat {root}/home/.aws/credentials || cat {root}/dotfiles/aws/credentials'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
