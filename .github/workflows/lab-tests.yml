# The lab's own tests: the decision procedure of spec/verdicts.md, contract
# validation, and the corpus against the reference sandboxes. No real sandbox
# and no attack against the host runs here (spec level A: safe CI).
name: lab tests

# Private repo, shared Actions quota: the tests run on the pull request only (not
# again on the push to main), only when the lab or the corpus changes, and macOS
# (billed x10) only by hand.
on:
  pull_request:
    paths: ["runner/**", "contracts/**", "corpus/**", "spec/**", ".github/workflows/lab-tests.yml"]
  workflow_dispatch:
    inputs:
      macos:
        description: "also run on macOS"
        type: boolean
        default: false

concurrency:
  group: lab-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: unit and reference tests
        run: python -m unittest discover -s runner/tests -v
      - name: corpus against the reference sandboxes
        env:
          SC_CORPUS: "1"
        run: python -m unittest runner/tests/test_corpus_reference.py
